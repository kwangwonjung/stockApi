name: Trigger Stock 10Month Data Sum Batch

on:
  schedule:
    # -9시로 계산
    - cron: '10 16,17,18 * * *'
  workflow_dispatch:

jobs:
  call-stock-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Send POST Request to Stock Day Data API
        run: |
          curl --fail-with-body --show-error --silent \
            --max-time 1200 \
            -X POST \
            https://musicholicstockapi.vercel.app/api/batchs/sync-stocksum