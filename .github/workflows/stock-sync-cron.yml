name: Trigger Stock Day Data Sync Batch

on:
  schedule:
    # -9시로 계산
    - cron: '10 15,17,19 * * *'
  workflow_dispatch:

jobs:
  call-stock-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Send POST Request to Stock Day Data API
        run: |
          curl --fail-with-body --show-error --silent \
            --max-time 120 \
            -X POST \
            https://musicholicstockapi.vercel.app/api/batchs/sync-stockmonth 